<div id="app">
  <main class="shell">
    <header class="app-header">
      <h1>DocuLens</h1>
      <p>文档扫描 · 本地处理</p>
    </header>

    <section class="panel source" aria-label="导入照片">
      <div class="file-control">
        <input id="file" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择照片" aria-describedby="file-info" />
        <label class="button file-label" for="file">选择照片</label>
        <p id="file-info" class="muted">JPEG、PNG 或 WebP</p>
      </div>
      <div class="primary-actions">
        <label class="field" for="mode">扫描效果
          <select id="mode">
            <option value="enhanced">去阴影</option>
            <option value="gray">灰度</option>
            <option value="binary">黑白</option>
          </select>
        </label>
        <button id="process" class="primary" type="button" disabled>生成扫描件</button>
      </div>
    </section>

    <div class="feedback">
      <p id="status" class="status" role="status">正在准备扫描功能…</p>
      <button id="retry-engine" type="button" hidden>重试加载</button>
    </div>

    <section id="workspace" class="previews" aria-label="扫描工作区" hidden>
      <figure class="panel preview">
        <figcaption><h2>原图</h2></figcaption>
        <div class="preview-surface crop-surface">
          <div id="crop-stage" class="crop-stage">
            <canvas id="input" width="1" height="1" aria-label="原图预览"></canvas>
            <canvas id="crop-outline" width="1" height="1" aria-hidden="true"></canvas>
            <button class="corner" type="button" aria-label="左上角" hidden></button>
            <button class="corner" type="button" aria-label="右上角" hidden></button>
            <button class="corner" type="button" aria-label="右下角" hidden></button>
            <button class="corner" type="button" aria-label="左下角" hidden></button>
          </div>
        </div>
        <p class="crop-hint muted">拖动四角调整裁切范围，或用方向键微调。</p>
        <div class="crop-actions">
          <button id="rotate" type="button" disabled>旋转 90°</button>
          <button id="redetect" type="button" disabled>重找纸边</button>
          <button id="reset-crop" type="button" disabled>使用整张照片</button>
        </div>
      </figure>
      <figure class="panel preview">
        <figcaption><h2>扫描结果</h2><span id="output-size" class="muted"></span></figcaption>
        <div class="preview-surface">
          <canvas id="output" width="1" height="1" aria-label="扫描结果预览" hidden></canvas>
          <p id="output-placeholder" class="muted">等待生成扫描件</p>
        </div>
        <div class="export" aria-label="导出">
          <label class="field" for="format">导出格式
            <select id="format">
              <option value="jpeg">JPEG</option>
              <option value="png">PNG</option>
              <option value="pdf">单页 PDF</option>
            </select>
          </label>
          <button id="save" class="primary" type="button" disabled>保存扫描件</button>
          <button id="share" type="button" disabled hidden>分享</button>
        </div>
      </figure>
    </section>

    <details class="diagnostics">
      <summary>诊断日志</summary>
      <pre id="log" class="log"></pre>
    </details>
  </main>
</div>
