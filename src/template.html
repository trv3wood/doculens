<div id="app">
  <main class="shell">
    <header>
      <h1>DocuLens</h1>
    </header>

    <section class="panel controls" aria-label="扫描设置">
      <button id="initialize" type="button">初始化引擎</button>
      <label class="file-label" for="file">选择 JPEG / PNG / WebP</label>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp" />
      <p id="file-info" class="muted">尚未选择图片</p>
      <label for="mode">扫描效果</label>
      <select id="mode">
        <option value="enhanced">去阴影</option>
        <option value="gray">灰度</option>
        <option value="binary">黑白</option>
      </select>
      <div class="scan-actions">
        <button id="process" type="button" disabled>生成扫描件</button>
        <button id="rotate" type="button" disabled>顺时针旋转 90°</button>
        <button id="redetect" type="button" disabled>重新找纸边</button>
        <button id="reset-crop" type="button" disabled>使用整张照片</button>
      </div>
    </section>

    <section class="panel previews" aria-label="处理结果">
      <figure>
        <figcaption>原图 · 拖动四角调整纸边，也可用方向键微调</figcaption>
        <div id="crop-stage" class="crop-stage">
          <canvas id="input" width="1" height="1"></canvas>
          <canvas id="crop-outline" width="1" height="1" aria-hidden="true"></canvas>
          <button class="corner" type="button" aria-label="左上角" hidden></button>
          <button class="corner" type="button" aria-label="右上角" hidden></button>
          <button class="corner" type="button" aria-label="右下角" hidden></button>
          <button class="corner" type="button" aria-label="左下角" hidden></button>
        </div>
      </figure>
      <figure>
        <figcaption>扫描结果</figcaption>
        <canvas id="output" width="1" height="1"></canvas>
      </figure>
    </section>

    <section class="panel export" aria-label="导出">
      <label for="format">导出格式</label>
      <select id="format">
        <option value="jpeg">JPEG</option>
        <option value="png">PNG</option>
        <option value="pdf">单页 PDF</option>
      </select>
      <button id="save" type="button" disabled>保存已准备文件</button>
      <button id="share" type="button" disabled>系统分享</button>
    </section>

    <p id="status" class="status" role="status">正在连接平台…</p>
    <pre id="log" class="log" aria-live="polite"></pre>
  </main>
</div>
