<div id="app">
  <header class="app-header">
    <div class="shell header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="10.5" cy="10.5" r="6.5"></circle>
            <path d="M15.6 15.6 21 21"></path>
          </svg>
        </span>
        <div class="brand-text">
          <h1>DocuLens</h1>
          <span class="brand-sub">扫描 · 裁切 · 导出</span>
        </div>
      </div>
      <span class="header-note">本地处理</span>
    </div>
  </header>

  <main class="shell">
    <section class="panel source" aria-label="导入照片">
      <div class="file-control">
        <input id="file" class="file-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择照片" aria-describedby="file-info" />
        <label class="button file-label" for="file">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <circle cx="8.5" cy="9.5" r="1.5"></circle>
            <path d="m21 15-5-5L5 21"></path>
          </svg>
          选择照片
        </label>
        <p id="file-info" class="muted">JPEG、PNG 或 WebP</p>
      </div>
      <div class="primary-actions">
        <fieldset id="mode" class="scan-modes">
          <legend>扫描效果</legend>
          <div class="mode-options">
            <label><input type="radio" name="mode" value="enhanced" checked /> <span>去阴影</span></label>
            <label><input type="radio" name="mode" value="gray" /> <span>灰度</span></label>
            <label><input type="radio" name="mode" value="binary" /> <span>黑白</span></label>
          </div>
        </fieldset>
        <button id="process" class="primary" type="button" disabled>生成扫描件</button>
      </div>
      <details class="advanced">
        <summary id="enhancement-options">高级增强</summary>
        <div class="enhancements">
          <label class="check"><input id="moire" type="checkbox" /> 去摩尔纹</label>
          <label class="check"><input id="deblur" type="checkbox" /> 模糊复原</label>
          <label class="field" for="blur-type" id="blur-type-field" hidden>模糊类型
            <select id="blur-type">
              <option value="auto">自动</option>
              <option value="motion">运动</option>
              <option value="defocus">失焦</option>
            </select>
          </label>
        </div>
      </details>
    </section>

    <div class="feedback">
      <p id="status" class="status" role="status">正在准备扫描功能…</p>
      <button id="retry-engine" type="button" hidden>重试加载</button>
    </div>

    <section id="workspace" class="previews" aria-label="扫描工作区" hidden>
      <figure class="panel preview">
        <figcaption><h2>原图</h2></figcaption>
        <div class="preview-surface crop-surface">
          <div id="crop-stage" class="crop-stage">
            <canvas id="input" width="1" height="1" aria-label="原图预览"></canvas>
            <canvas id="crop-outline" width="1" height="1" aria-hidden="true"></canvas>
            <button class="corner" type="button" aria-label="左上角" hidden></button>
            <button class="corner" type="button" aria-label="右上角" hidden></button>
            <button class="corner" type="button" aria-label="右下角" hidden></button>
            <button class="corner" type="button" aria-label="左下角" hidden></button>
          </div>
        </div>
        <p class="crop-hint muted">拖动四角调整裁切范围，或用方向键微调。</p>
        <div class="crop-actions">
          <button id="rotate" type="button" disabled>旋转 90°</button>
          <button id="redetect" type="button" disabled>重找纸边</button>
          <button id="reset-crop" type="button" disabled>使用整张照片</button>
        </div>
      </figure>
      <figure class="panel preview">
        <figcaption><h2>扫描结果</h2><span id="output-size" class="muted"></span></figcaption>
        <div class="preview-surface">
          <canvas id="output" width="1" height="1" aria-label="扫描结果预览" hidden></canvas>
          <p id="output-placeholder" class="muted">等待生成扫描件</p>
        </div>
        <div class="export" aria-label="导出">
          <label class="field" for="format">导出格式
            <select id="format">
              <option value="jpeg">JPEG</option>
              <option value="png">PNG</option>
              <option value="pdf">单页 PDF</option>
            </select>
          </label>
          <button id="save" class="primary" type="button" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3v11"></path>
              <path d="m7 10 5 5 5-5"></path>
              <path d="M5 21h14"></path>
            </svg>
            保存扫描件
          </button>
          <button id="share" type="button" disabled hidden>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path>
              <path d="M16 6l-4-4-4 4"></path>
              <path d="M12 2v14"></path>
            </svg>
            分享
          </button>
        </div>
      </figure>
    </section>

    <details class="diagnostics">
      <summary>诊断日志</summary>
      <pre id="log" class="log"></pre>
    </details>
  </main>
</div>
